name: Pro Football Android
run-name: ${{ inputs.reuse_apk_run_id && format('Pro verify {0} · {1}', inputs.reuse_apk_artifact, github.ref_name) || format('Pro build {0} · {1} · {2}', github.run_number, inputs.validation_scope || 'full', github.ref_name) }}
on:
  push:
    branches: [main]
    paths:
      - 'src/Football.Engine/**'
      - 'src/Football.Presentation/**'
      - 'src/ProFootball.Core/**'
      - 'src/ProFootball.App/**'
      - 'tests/ProFootball.Tests/**'
      - 'build/pro-*.py'
      - 'global.json'
      - '.github/workflows/pro-android.yml'
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Finance checks financial management; termination checks release/waiver/accrual; live checks GameCast; other scopes cover their management flows
        type: choice
        options: [parity, fast, full, live]
        default: fast
      reuse_apk_run_id:
        description: Optional prior run ID for test-only retries; app-source differences reject reuse
        type: string
        default: ''
      reuse_apk_artifact:
        description: Original APK artifact name when reusing a prior build
        type: string
        default: ''
      version_code_offset:
        description: Offset build numbering above separately numbered workflow installs
        type: number
        default: 1000
      run_emulator:
        description: Run Pro Android device validation after uploading the APK
        type: boolean
        default: false
  workflow_call:
    inputs:
      validation_scope:
        description: Validation scope passed through to the established Pro workflow
        type: string
        default: fast
      reuse_apk_run_id:
        description: Optional prior run ID for test-only retries; app-source differences reject reuse
        type: string
        default: ''
      reuse_apk_artifact:
        description: Original APK artifact name when reusing a prior build
        type: string
        default: ''
      version_code_offset:
        description: Offset build numbering above separately numbered workflow installs
        type: number
        default: 1000
      run_emulator:
        description: Run Pro Android device validation after uploading the APK
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: pro-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pro-build:
    if: inputs.reuse_apk_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: pro-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','global.json') }}
          restore-keys: pro-nuget-${{ runner.os }}-
      - run: dotnet workload install maui-android --version 10.0.301.1
      - name: Test UI synchronization helpers
        run: python3 -m unittest discover -s build -p 'test_android_ui_smoke.py'
      - name: Verify NFLPA cap data normalization
        run: python3 build/verify-nflpa-cap-data.py
      - name: Full Pro tests
        env:
          PRO_TRADE_UI_FIXTURE: ${{ github.workspace }}/pro-trade-ui-fixture.json.gz
          PRO_COORDINATOR_UI_FIXTURES: ${{ github.workspace }}
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full'
        run: dotnet test tests/ProFootball.Tests/ProFootball.Tests.csproj -c Release
      - name: Pro scoped regressions
        env:
          PRO_TRADE_UI_FIXTURE: ${{ github.workspace }}/pro-trade-ui-fixture.json.gz
          PRO_COORDINATOR_UI_FIXTURES: ${{ github.workspace }}
        if: github.event_name == 'push' || (inputs.validation_scope != 'parity' && inputs.validation_scope != 'fast' && inputs.validation_scope != 'full')
        run: dotnet test tests/ProFootball.Tests/ProFootball.Tests.csproj -c Release --filter 'FullyQualifiedName!~TwentySeasons&FullyQualifiedName!~SourcedFiveSeasons'
      - name: Focused parity regressions
        if: inputs.validation_scope == 'parity' || inputs.validation_scope == 'fast'
        run: dotnet test tests/ProFootball.Tests/ProFootball.Tests.csproj -c Release --filter 'Category=Fast'
      - name: Set CI Android version metadata
        shell: bash
        env:
          VERSION_CODE_OFFSET: ${{ inputs.version_code_offset || 0 }}
        run: |
          version_code=$((GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET))
          echo "APP_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "APP_DISPLAY_VERSION=0.1.$version_code" >> "$GITHUB_ENV"

      - name: Build independent pro APK
        run: >
          dotnet build src/ProFootball.App/ProFootball.App.csproj -c Debug -f net10.0-android
          -p:AndroidPackageFormats=apk -p:ApplicationVersion="$APP_VERSION_CODE"
          -p:ApplicationDisplayVersion="$APP_DISPLAY_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: pro-football-apk-${{ github.run_number }}
          path: |
            src/ProFootball.App/bin/Debug/net10.0-android/*-Signed.apk
          compression-level: 0
          retention-days: 7
  pro-device:
    needs: pro-build
    if: inputs.run_emulator && inputs.validation_scope != 'fast' && inputs.validation_scope != 'parity' && always() && !cancelled() && (needs.pro-build.result == 'success' || inputs.reuse_apk_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify reused APK matches current application inputs
        if: inputs.reuse_apk_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.reuse_apk_run_id }}
          APK_ARTIFACT: ${{ inputs.reuse_apk_artifact }}
        run: |
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$APK_ARTIFACT" =~ ^pro-football-apk-[0-9]+$ ]] || exit 1
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID" --jq '.head_sha')
          git fetch --no-tags origin "$source_sha" --depth=1
          git diff --exit-code "$source_sha" HEAD -- src/ProFootball.App src/ProFootball.Core src/Football.Engine src/Football.Presentation Directory.Build.props Directory.Build.targets Directory.Packages.props global.json NuGet.Config build/keys
      - name: Test changed UI synchronization helpers
        if: inputs.reuse_apk_run_id != ''
        run: python3 -m unittest discover -s build -p 'test_android_ui_smoke.py'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.reuse_apk_artifact || format('pro-football-apk-{0}', github.run_number) }}
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_apk_run_id || github.run_id }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          heap-size: 512
          disable-animations: true
          script: |
            adb install -r $(find apk -name '*-Signed.apk' -print -quit)
            adb shell monkey -p antdroid.profootball.franchise -c android.intent.category.LAUNCHER 1
            python3 -u build/pro-android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-ui-evidence-${{ github.run_number }}
          path: |
            android-pro-*.png
            android-pro-*.xml
          retention-days: 3
