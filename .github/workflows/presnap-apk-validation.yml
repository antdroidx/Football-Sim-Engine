name: Pre-snap APK validation
run-name: Pre-snap APK validation · ${{ github.ref_name }}

on:
  push:
    branches:
      - codex/presnap-formation-motion-fixes
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  college:
    name: College tests and APK
    uses: ./.github/workflows/csharp-ci.yml
    with:
      management_scope: full
      reuse_apk_run_id: ''
      reuse_apk_artifact: ''
      run_emulator: true
      run_career_health: false
      version_code_offset: 1000
      run_rating_calibration: false

  pro:
    name: Pro tests and APK
    uses: ./.github/workflows/pro-android.yml
    with:
      validation_scope: live
      reuse_apk_run_id: ''
      reuse_apk_artifact: ''
      college_run: ''
      college_artifact: ''
      version_code_offset: 1000
      run_emulator: true
